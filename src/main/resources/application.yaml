spring:
  application:
    name: Lingtu-Agent
  datasource:
    url: jdbc:mysql://localhost:3306/lingtu_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234567}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 120.26.162.26       # 替换为您的服务器IP
      port: 6379               # 默认端口，若修改则改
      password: ${REDIS_PASSWORD:MyRedis@2026123}  # 若无密码则注释或留空
      timeout: 5000ms          # 连接超时
      lettuce:
        pool:
          max-active: 8        # 连接池最大连接数
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
jwt:
# 优先读取环境变量 JWT_SECRET，如果没有设置，则使用后面的默认值
  secret: ${JWT_SECRET:LingtuAgentDefaultSecretKey2024!!}
  expiration: 86400000
# ========== AI 配置（DeepSeek 大模型） ==========
langchain4j:
  openai:
    chat-model:
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
      base-url: https://api.deepseek.com
      model-name: deepseek-v4-flash
      temperature: 0.7
      max-tokens: 4096
      timeout: 60s
      log-requests: true
      log-responses: true
    streaming-chat-model:
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
      base-url: https://api.deepseek.com
      model-name: deepseek-v4-flash
      temperature: 0.7
      max-tokens: 4096
      timeout: 120s
      log-requests: true
      log-responses: true
