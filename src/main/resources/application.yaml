spring:
  application:
    name: Lingtu-Agent
  datasource:
    url: jdbc:mysql://localhost:3306/lingtu_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234567
    driver-class-name: com.mysql.cj.jdbc.Driver
#  data:
#    redis:
#      host: localhost
#      port: 6379
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
jwt:
# 优先读取环境变量 JWT_SECRET，如果没有设置，则使用后面的默认值
  secret: ${JWT_SECRET:LingtuAgentDefaultSecretKey2024!!}
  expiration: 86400000
